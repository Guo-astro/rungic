<!-- The session bus of the independent desktop, workspace 0 (docs/research/97 §19): the agent
     workspaces' bus, with the user's secret service passed through first (rungic-bus-forward: the
     passwords' files have one ksecretd, the phone session's), and polkit's prompts of the desktop's
     apps shown in it (the agent's delegate, docs/research/97 §21). A service directory listed
     earlier wins. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <servicedir>/usr/share/rungic-workspace/dbus-1/desktop-services</servicedir>
  <servicedir>/usr/share/rungic-workspace/dbus-1/services</servicedir>
  <include>/usr/share/dbus-1/session.conf</include>
</busconfig>
