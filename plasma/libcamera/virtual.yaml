# Names are existing Android-backed PipeWire nodes, not new hardware paths.
rungic-pipewire-back:
  model: Android 后置相机
  location: CameraLocationBack
  pipewire_node: rungic.camera.0
  supported_formats:
    - width: 720
      height: 1280
      frame_rates: [30]
rungic-pipewire-front:
  model: Android 前置相机
  location: CameraLocationFront
  pipewire_node: rungic.camera.1
  supported_formats:
    - width: 720
      height: 1280
      frame_rates: [30]
