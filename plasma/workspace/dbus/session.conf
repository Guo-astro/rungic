<!-- The session bus of an agent workspace (docs/research/91): the standard session bus, with the
     workspace's own services first (a service directory listed earlier wins). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <servicedir>/usr/share/rungic-workspace/dbus-1/services</servicedir>
  <include>/usr/share/dbus-1/session.conf</include>
</busconfig>
