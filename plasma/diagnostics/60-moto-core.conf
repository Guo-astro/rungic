# Installed as /etc/systemd/system.conf.d/ and /etc/systemd/user.conf.d/60-moto-core.conf.
# Android owns the global kernel.core_pattern (/data/app_dump/%e_%p_%t.core.gz).
# The kernel resolves that path inside the crashing process's root, so desktop
# cores land in the container's /data/app_dump, where moto-coredump collects
# them. Android's own directory is not touched. The soft limit bounds one core.
[Manager]
DefaultLimitCORE=2G:infinity
