# Moto (docs/40, docs/61): Android decides about power. UPower reports the real battery,
# but its critical-battery action must not shut down or hibernate the container.
# A drop-in (UPower 1.91 reads UPower.conf.d after UPower.conf) instead of editing
# Ubuntu's UPower.conf.
[UPower]
AllowRiskyCriticalPowerAction=true
CriticalPowerAction=Ignore
