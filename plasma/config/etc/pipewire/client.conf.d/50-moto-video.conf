# This container uses PulseAudio for audio and PipeWire for video/portals.
# There is no RTKit scheduler here. The Realtime portal currently returns a
# zero RTTimeUSecMax; module-rt turns that into a process-wide zero RTTIME
# limit and the kernel kills GStreamer streaming threads. Video clients use
# normal scheduling. Do not remove RT resource safeguards globally.
context.properties = {
    module.rt = false
}
