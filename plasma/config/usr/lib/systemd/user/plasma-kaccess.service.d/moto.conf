# kaccess forces QT_QPA_PLATFORM=xcb (plasma-desktop kaccess/main.cpp) and aborts when there is no
# X display; the session runs without Xwayland, so each start crashed 5-6 times until systemd gave
# up (signature f6f8756afbd8). Its XKB accessibility features are KWin plugins on Wayland. Skip it
# while the user manager has no DISPLAY; it runs again if Xwayland exports one (docs/61).
[Unit]
ConditionEnvironment=DISPLAY
