# The rootfs image ships without SSH host keys, so every phone makes its own (docs/83). Ubuntu
# generates them only on the first boot (ConditionFirstBoot), long before SSH is turned on here:
# generate them whenever they are missing. An empty assignment resets all conditions; the others
# are Ubuntu's own.
[Unit]
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
ConditionPathExists=|!/etc/ssh/ssh_host_ed25519_key
ConditionPathExists=|!/etc/ssh/ssh_host_ecdsa_key
ConditionPathExists=|!/etc/ssh/ssh_host_rsa_key
