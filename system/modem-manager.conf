<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- org.freedesktop.ModemManager1 is owned by the Android telephony bridge (shared/platform/modem-manager.py,
     docs/73): Android's RIL owns the modem. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
  <!-- UID 1000 retains this primary group after a login-name change. -->
  <policy group="rungic">
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
</busconfig>
