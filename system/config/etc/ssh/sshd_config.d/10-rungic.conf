# SSH login to the container (docs/83): on by default (the user's requirement, AGENTS.md 2026-09-29); the
# Services page turns ssh.socket off and on.
# The account password and keys in ~/.ssh/authorized_keys both work. sshd keeps the first value it
# reads, so this file comes before the Ubuntu cloud image's 60-cloudimg-settings.conf
# (PasswordAuthentication no). root keeps Ubuntu's prohibit-password.
PasswordAuthentication yes
PubkeyAuthentication yes
