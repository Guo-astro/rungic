<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- org.bluez is owned by the Android Bluetooth bridge (shared/platform/bluez.py, docs/73): the
     container has no controller and bluetoothd is masked. -->
<busconfig>
  <policy user="root">
    <allow own="org.bluez"/>
    <allow send_destination="org.bluez"/>
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.Profile1"/>
  </policy>
  <!-- UID 1000 retains this primary group after a login-name change. -->
  <policy group="rungic">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
