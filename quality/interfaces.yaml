# The interfaces through which Linux system features use Android (quality/README.md). Each is one
# contract: its Linux consumers are tested against a stand-in (covers[consumer]: iface:ID), Android's
# provider on the phone (covers[provider]: iface:ID). Consumers are the features naming it in their
# `interfaces`. On a PC these are what another backend would provide.
- id: platform-bridge
  title: 平台桥
  summary: 逐行 JSON 的 Unix socket（Rungic 应用 files/tmp/platform.sock）：状态、显示、亮度、方向、振动、设置面板、桌面模式、助理屏、电视与导播台、文字提交。
  provider:
    - android/app/src/com/rungic/plasma/PlatformBridge.java
    - android/app/src/com/rungic/plasma/MainActivity.java
- id: kwin-android-host
  title: KWin 安卓宿主
  summary: KWin 的 android-host 后端与 Rungic 应用里的宿主：输出、帧时钟、零拷贝呈现、显式同步、空闲抑制、投屏输出。
  provider:
    - android/host/
    - packages/android-host/
- id: host-input
  title: 宿主输入
  summary: 安卓的触摸、按键、指针、手势与输入法文字送进 KWin（直接触摸、触控板、电视遥控与键盘）。
  provider:
    - android/app/src/com/rungic/plasma/HostEvents.java
    - android/app/src/com/rungic/plasma/TouchpadGestures.java
    - android/app/src/com/rungic/plasma/PointerTransfer.java
    - android/app/src/com/rungic/plasma/GestureRules.java
- id: camera
  title: 相机
  summary: 安卓 Camera2 的画面作为 PipeWire 相机节点（rungic.camera.N），按需开关；有哪些相机由平台桥的 capture-info 回答。
  provider:
    - android/app/src/com/rungic/plasma/CaptureBridge.java
    - android/app/src/com/rungic/plasma/CaptureService.java
- id: audio
  title: 扬声器与麦克风
  summary: 安卓的扬声器和麦克风作为 PulseAudio 设备（android、android_phone 输出与麦克风源），按需挂起；输出经安卓侧的 PulseAudio（system/android-audio）。
  provider:
    - android/app/src/com/rungic/plasma/CaptureBridge.java
    - system/android-audio
    - system/android-audio.pa
- id: communication-audio
  title: 通话音频
  summary: $XDG_RUNTIME_DIR/rungic-communication.sock：电话模式与通话用的双向通信音频（android_communication 设备）。
  provider:
    - shared/media/communication-audio.cpp
- id: codec
  title: 硬件编解码
  summary: 安卓 MediaCodec 经 IPC 给 GStreamer、FFmpeg 和 Firefox 用（H.264/HEVC/VP9 解码、H.264 编码）。
  provider:
    - android/app/src/com/rungic/plasma/CodecBridge.java
- id: clipboard
  title: 剪贴板
  summary: 安卓 ClipboardDaemon 与 Wayland 剪贴板双向同步。
  provider:
    - android/app/src/com/rungic/clipboard/ClipboardDaemon.java
- id: network
  title: 网络
  summary: 安卓的 Wi-Fi 与网络状态，经 Linux 一侧的 NetworkManager D-Bus 接口给桌面用。
  provider:
    - android/app/src/com/rungic/plasma/AndroidNetworkBridge.java
    - android/app/src/com/rungic/wifi/RootWifi.java
- id: bluetooth
  title: 蓝牙
  summary: 安卓蓝牙经 Linux 一侧的 BlueZ D-Bus 接口给桌面用。
  provider:
    - android/app/src/com/rungic/plasma/AndroidBluetoothBridge.java
    - android/app/src/com/rungic/bluetooth/RootBluetooth.java
- id: telephony
  title: 蜂窝与通话
  summary: 蜂窝网络状态（ModemManager 接口）、来电去电与通话控制。
  provider:
    - android/app/src/com/rungic/plasma/AndroidTelephonyBridge.java
    - android/app/src/com/rungic/telephony/
- id: ocr
  title: 文字识别
  summary: 手机 GPU 上的 OCR（PP-OCR），给目标式电脑操作用。
  provider:
    - android/app/src/com/rungic/plasma/OcrBridge.java
    - android/app/jni/ocr/
- id: wifi-display
  title: 无线投屏
  summary: 经安卓（高通）Wi-Fi Display 栈把输出投到电视：扫描、连接、断开、重连。
  provider:
    - shared/android/rungic-cast/
    - shared/android/rungic-cast-watch.sh
    - android/app/src/com/rungic/plasma/CastDesktop.java
    - android/app/src/com/rungic/plasma/CastControls.java
    - profiles/cast-adapters.json
- id: shared-storage
  title: 共享存储
  summary: 安卓的共享存储（/storage/emulated/0/Plasma，MediaProvider FUSE）挂到容器的 /mnt/android-shared，用户目录和 ~/Shared 都在上面。
  provider:
    - system/shared-storage
- id: gpu-device
  title: GPU 设备
  summary: 内核的 KGSL（/dev/kgsl-3d0）与 dma-heap（/dev/dma_heap/system）设备节点，Mesa、Xwayland、Flatpak 和系统监视器经它们用 Adreno；PC 上换成 DRM。
  provider:
    - system/plasma.config
- id: host-controller
  title: 宿主控制器
  summary: Rungic 应用经 Magisk su 调用的 rungic-plasma 动作及其输出：账户状态与设置、安装发布、启停会话、内存上限；安装状态写在应用私有的 rungic-install.properties。
  provider:
    - system/rungic-plasma
    - android/app/src/com/rungic/plasma/FirstBootState.java

